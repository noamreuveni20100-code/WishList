<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mywishlist - Sign Up</title>
    <link rel="stylesheet" href="/website/styles/general.css" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="signUp.css" />
  </head>

  <body>
    <div id="boxDiv">
      <h1>Let's Sign Up</h1>

      <table>
        <tr>
          <td>Username:</td>
          <td><input id="usernameInput" placeholder="Choose a username..." /></td>
        </tr>
        <tr>
          <td>Password:</td>
          <td><input id="passwordInput" type="password" placeholder="Choose a password..." /></td>
        </tr>
        <tr>
          <td>Confirm:</td>
          <td><input id="confirmPasswordInput" type="password" placeholder="Confirm your password..." /></td>
        </tr>
      </table>
      
      <br />
      <button id="submitButton">Sign Up</button>
      <br />
      
      <div id="errorDiv"></div>
      <br />
      
      <p>Already have an account? <a href="logIn.html">Log In here</a></p>
    </div>

    <script type="module" src="signUp.js"></script>
  </body>
</html>
